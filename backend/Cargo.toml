[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/api",
    "crates/orderbook",
    "crates/settler",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["Rujul <rujul@example.com>"]

[workspace.dependencies]
# Internal
common = { path = "crates/common" }

# Async runtime + HTTP
tokio = { version = "1.40", features = ["full"] }
actix-web = "4.9"
actix-web-actors = "4.3"
actix-cors = "0.7"
actix-rt = "2.10"
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"

# Redis
redis = { version = "0.27", features = ["tokio-comp", "streams", "connection-manager"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
hex = "0.4"
bs58 = "0.5"

# Decimals
rust_decimal = { version = "1.36", features = ["serde-with-str"] }
rust_decimal_macros = "1.36"

# Auth
jsonwebtoken = "9.3"
ed25519-dalek = { version = "2.1", features = ["std"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"

# Solana (for settler only)
solana-sdk = "2.2"
solana-client = "2.2"
anchor-client = "0.31"
anchor-lang = "0.31"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Errors / utils
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
dotenvy = "0.15"

# Dev dependencies
[workspace.dev-dependencies]
tokio = { version = "1.40", features = ["full", "test-util"] }
proptest = "1.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
